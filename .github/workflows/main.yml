name: 15分钟自动扫描对时更新

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 同步并运行
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 关键修复：先 pull 确保本地干净
          git pull --rebase origin main
          
          # 运行 002 对应的脚本名
          python update_all.py
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "自动更新对时: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "无变动，跳过推送。"
          fi
